<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Програмування в Internet — лабораторні роботи</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 52rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 6rem) 1.25rem;
      color: #222;
      font: 1rem/1.6 Arial, sans-serif;
    }
    h1 { margin: 0 0 2rem; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; }
    h2 { margin-bottom: 0.75rem; font-size: 1.25rem; }
    ul { margin: 0; padding-left: 1.25rem; }
    a { color: #252775; text-underline-offset: 0.18em; }
    a:hover, a:focus-visible { color: #006a96; }
  </style>
</head>
<body>
  <main>
    <h1>Програмування в Internet</h1>
    <nav aria-labelledby="labs-title">
      <h2 id="labs-title">Лабораторні роботи</h2>
      <ul>
      </ul>
    </nav>
  </main>
</body>
</html>
